<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarea</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <header> 
            <span>🤞</span>
           <h1> Mi Lista de tareas</h1>
        </header>
        <div class="input-container">
            <input type="text" id="input-id" placeholder="Añade tu nueva tarea" autocomplete="off">
            <button id="btn-class" class="btn-submit"> 
                <span>+</span> Agregar
            </button>
        </div>
        <ul class="task-list"> 
            <li class="task-item">
                <div class="task-container">
                    <buttom class="task-container">✔</buttom>
                    <span class="task-name">Tarea pendiente</span>
                    </div>
                    <button class="btn-delete">🗑</button>
            </li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
