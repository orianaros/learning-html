<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice programación</title>

    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #F5F3FF;
            font-family: system-ui, Arial, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
            box-sizing: border-box;
        }

        h1 {
            color: #3C3489;
            text-align: center;
            margin-bottom: 40px;
        }

        /* La lista se convierte en una cuadrícula de 2 columnas */
        ul {
            list-style: none;      /* quita los puntitos de la lista */
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        /* Cada enlace es una tarjeta */
        li a {
            display: block;
            background-color: white;
            border-radius: 12px;
            border-top: 6px solid gray;   /* el color se cambia en cada tarjeta */
            padding: 24px;
            text-decoration: none;        /* quita el subrayado */
            color: #333;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        /* Al pasar el ratón la tarjeta sube un poco */
        li a:hover {
            transform: translateY(-4px);
        }

        /* El "icono" de cada tarjeta */
        .icono {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        /* Un color distinto para cada tema */
        .html { border-top-color: #E34F26; }
        .html .icono { color: #E34F26; }

        .css { border-top-color: #1572B6; }
        .css .icono { color: #1572B6; }

        .js { border-top-color: #D9A400; }
        .js .icono { color: #D9A400; }

        .ejercicios { border-top-color: #534AB7; }
        .ejercicios .icono { color: #534AB7; }

        /* En pantallas pequeñas (móvil) una sola columna */
        @media (max-width: 500px) {
            ul {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Máster Desarrollo de Software y Negocio Digital 2026</h1>

    <ul>
        <li><a class="html" href="html/index.html"><span class="icono">&lt;/&gt;</span>HTML</a></li>
        <li><a class="css" href="css/index.html"><span class="icono">{ }</span>CSS</a></li>
        <li><a class="js" href="js/index.html"><span class="icono">JS</span>JavaScript</a></li>
        <li><a class="ejercicios" href="exercise/index.html"><span class="icono">✎</span>Ejercicios</a></li>
    </ul>
</body>
</html>
